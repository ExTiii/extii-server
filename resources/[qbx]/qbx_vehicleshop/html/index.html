<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>المعرض</title>
    <link rel="stylesheet" href="kit.css?v=2" />
    <link rel="stylesheet" href="style.css?v=3" />
</head>
<body class="kit">
    <div id="shop" class="shop" aria-hidden="true">
        <!-- caption over the 3D car -->
        <div class="stage" id="stage"></div>
        <div class="loading3d" id="loading3d"><span class="spinner"></span> جارٍ تحميل المركبة…</div>

        <section class="panel" role="dialog" aria-label="المعرض">
            <!-- List screen -->
            <div class="screen screen-list" id="screen-list">
                <header class="top">
                    <div class="brand">
                        <span class="brand-icon" id="shop-icon"></span>
                        <div class="brand-text">
                            <h1 id="shop-title">المعرض</h1>
                            <p id="shop-subtitle"></p>
                        </div>
                    </div>
                    <button class="icon-btn" data-action="close" aria-label="إغلاق"></button>
                </header>

                <div class="tools">
                    <div class="tools-row">
                        <label class="search">
                            <span class="search-icon"></span>
                            <input id="search" type="text" maxlength="40" placeholder="ابحث باسم المركبة" autocomplete="off" />
                        </label>
                        <div class="view-toggle" role="group" aria-label="طريقة العرض">
                            <button class="vt" data-view="list" aria-label="قائمة"></button>
                            <button class="vt" data-view="grid" aria-label="شبكة"></button>
                        </div>
                    </div>
                    <div class="chips" id="chips"></div>
                </div>

                <div class="list-wrap" id="list-wrap">
                    <div id="list"></div>
                </div>
                <footer class="foot" id="foot"></footer>
            </div>

            <!-- Details screen -->
            <div class="screen screen-detail" id="screen-detail"></div>

            <!-- Bottom sheet -->
            <div class="sheet-layer" id="sheet-layer">
                <div class="sheet-backdrop" data-action="sheet-close"></div>
                <div class="sheet" id="sheet"></div>
            </div>

            <div class="toast" id="toast" role="status"></div>
        </section>
    </div>
    <script src="app.js?v=4"></script>
</body>
</html>
