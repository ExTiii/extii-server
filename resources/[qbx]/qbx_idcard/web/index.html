<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="kit.css?v=1">
    <link rel="stylesheet" href="idcard.css?v=2">
</head>
<body>
    <div id="card" class="kit idc" aria-hidden="true">
        <div class="idc-head">
            <img class="idc-logo" src="logo.png" alt="">
            <div class="idc-titles">
                <span class="idc-type" id="cardtype">بطاقة الهوية</span>
                <span class="idc-city">مدينة لوس سانتوس <span class="idc-en">(Los Santos)</span></span>
            </div>
            <div class="idc-level" id="level"><span>المستوى</span><b id="levelnum"></b></div>
            <div class="idc-badge" id="badge">
                <img id="badgeimg" src="" alt="">
                <span id="badgegrade"></span>
            </div>
        </div>

        <div class="idc-body">
            <div class="idc-photo">
                <img id="mugshot" src="" alt="">
            </div>
            <div class="idc-fields">
                <div class="idc-field">
                    <span class="idc-label">الاسم الأول</span>
                    <span class="idc-value" id="firstname"></span>
                </div>
                <div class="idc-field">
                    <span class="idc-label">اسم العائلة</span>
                    <span class="idc-value" id="lastname"></span>
                </div>
                <div class="idc-field">
                    <span class="idc-label">تاريخ الميلاد</span>
                    <span class="idc-value idc-ltr" id="dob"></span>
                </div>
                <div class="idc-field">
                    <span class="idc-label">الجنس</span>
                    <span class="idc-value" id="sex"></span>
                </div>
                <div class="idc-field">
                    <span class="idc-label">الجنسية</span>
                    <span class="idc-value" id="nationality"></span>
                </div>
                <div class="idc-field">
                    <span class="idc-label">رقم المواطن</span>
                    <span class="idc-value idc-ltr idc-mono" id="citizenid"></span>
                </div>
            </div>
        </div>

        <div class="idc-foot">
            <div class="idc-sign">
                <span class="idc-label">التوقيع</span>
                <span class="idc-signature" id="sign"></span>
            </div>
            <span class="idc-hint">للإغلاق اضغط <b>Backspace</b></span>
        </div>

        <div class="idc-timer"><span id="timer"></span></div>
    </div>

    <script src="js/main.js?v=1"></script>
</body>
</html>
