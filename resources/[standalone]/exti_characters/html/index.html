<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>الشخصيات</title>
    <link rel="stylesheet" href="kit.css?v=1" />
    <link rel="stylesheet" href="style.css?v=2" />
</head>
<body class="kit">
    <div id="root" class="root">
        <!-- caption over the game view (left side) -->
        <div class="caption" id="caption"></div>

        <section class="panel" id="panel" role="dialog" aria-label="الشخصيات">
            <div class="screen" id="screen"></div>

            <div class="sheet-layer" id="sheet-layer">
                <div class="sheet-backdrop" data-action="sheet-close"></div>
                <div class="sheet" id="sheet"></div>
            </div>
            <div class="toast" id="toast" role="status"></div>
        </section>
    </div>

    <!-- cinematic overlay: arriving in the city -->
    <div class="cinema" id="cinema" aria-hidden="true">
        <div class="bar bar-top"></div>
        <div class="bar bar-bottom"></div>
        <div class="cine-title">
            <img class="cine-logo" src="logo.png" alt="" />
            <span class="cine-kicker">EX_Tii Roleplay</span>
            <span class="cine-line"></span>
            <h1 id="cine-h1"></h1>
            <p id="cine-sub"></p>
        </div>
        <div class="cine-card">
            <span class="cine-card-icon">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12" rx="2.4"/><path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5M3 12.5h18M10.5 12.5v1.6h3v-1.6"/></svg>
            </span>
            <div class="cine-card-text">
                <b id="cine-card-title"></b>
                <small id="cine-card-sub"></small>
            </div>
        </div>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
