<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EX_Tii · المظهر</title>
<link rel="stylesheet" href="ex.css">
</head>
<body>
<div id="app" class="hidden" aria-hidden="true">

    <!-- the panel: everything you pick -->
    <section id="panel" aria-label="لوحة المظهر">
        <header class="p-head">
            <div class="p-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-hanger"/></svg></div>
            <div class="p-titles">
                <h1 id="title">متجر الملابس</h1>
                <p id="subtitle">اختر ما يعجبك، وادفع عند الخروج</p>
            </div>
            <button id="close" class="icon-btn" type="button" aria-label="إغلاق"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
        </header>

        <!-- creator steps (character creation only) -->
        <ol id="steps" class="steps hidden"></ol>

        <!-- groups, then the categories of the group -->
        <nav id="groups" class="groups" aria-label="الأقسام"></nav>
        <nav id="cats" class="cats" aria-label="الفئات"></nav>

        <div id="body" class="p-body"></div>

        <footer id="foot" class="p-foot"></footer>
    </section>

    <!-- the camera and the body, next to the character -->
    <div id="dock" class="dock" aria-label="التحكم بالكاميرا">
        <div class="dock-row" id="views"></div>
        <div class="dock-row">
            <button class="dock-btn" data-act="rotL" type="button" title="لفّ الكاميرا"><svg viewBox="0 0 24 24"><use href="#i-rot-l"/></svg></button>
            <button class="dock-btn" data-act="turn" type="button" title="استدر"><svg viewBox="0 0 24 24"><use href="#i-turn"/></svg><span>استدر</span></button>
            <button class="dock-btn" data-act="rotR" type="button" title="لفّ الكاميرا"><svg viewBox="0 0 24 24"><use href="#i-rot-r"/></svg></button>
            <span class="dock-sep"></span>
            <button class="dock-btn" data-strip="head" type="button" title="اخلع ما على الرأس"><svg viewBox="0 0 24 24"><use href="#i-cap"/></svg></button>
            <button class="dock-btn" data-strip="body" type="button" title="اخلع ما على الجسم"><svg viewBox="0 0 24 24"><use href="#i-shirt"/></svg></button>
            <button class="dock-btn" data-strip="bottom" type="button" title="اخلع البنطال والحذاء"><svg viewBox="0 0 24 24"><use href="#i-pants"/></svg></button>
        </div>
        <p class="dock-hint">اسحب بالفأرة لتدير الشخصية</p>
    </div>

    <!-- a question before leaving / paying -->
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
            <h2 id="m-title"></h2>
            <p id="m-text"></p>
            <div class="modal-acts">
                <button id="m-yes" class="btn gold" type="button"></button>
                <button id="m-no" class="btn ghost" type="button">رجوع</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
</div>

<!-- dev only: the mode switch when the page is opened in a browser -->
<div id="devbar" class="hidden"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
