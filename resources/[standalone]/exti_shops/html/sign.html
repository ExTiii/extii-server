<!doctype html>
<!-- EX_Tii: the notice taped on the wall of every Ammu-Nation (used as a texture in the game) -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face { font-family: 'P'; src: url('fonts/plex-arabic-700.woff2') format('woff2'); font-weight: 700; unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: 'P'; src: url('fonts/plex-arabic-500.woff2') format('woff2'); font-weight: 500; unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: 'P'; src: url('fonts/plex-latin-700.woff2') format('woff2'); font-weight: 700; unicode-range: U+0000-00FF; }
@font-face { font-family: 'P'; src: url('fonts/plex-latin-500.woff2') format('woff2'); font-weight: 500; unicode-range: U+0000-00FF; }
html, body { margin: 0; width: 512px; height: 384px; background: transparent; overflow: hidden; font-family: 'P', sans-serif; }
.paper { position: absolute; inset: 14px 18px; background: #f3efe4; box-shadow: 0 4px 10px rgba(0,0,0,.35); transform: rotate(-1.2deg); display: grid; grid-template-rows: 58px 1fr 44px; }
.band { background: #b3261e; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.band b { font-size: 26px; } .band span { font-size: 15px; letter-spacing: 3px; font-weight: 700; direction: ltr; }
.body { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 14px; padding: 10px 20px; }
.body h1 { margin: 0; font-size: 31px; line-height: 1.35; color: #1d1d1b; }
.body p { margin: 6px 0 0; font-size: 16px; color: #3d3b36; font-weight: 500; }
.icon { width: 120px; height: 120px; }
.foot { border-top: 2px solid #1d1d1b; margin: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #3d3b36; font-weight: 500; }
.foot .en { direction: ltr; letter-spacing: 1px; }
.tape { position: absolute; width: 90px; height: 26px; background: rgba(230, 220, 170, .75); top: 2px; }
.tape.l { left: 10px; transform: rotate(-8deg); } .tape.r { right: 10px; transform: rotate(7deg); }
</style></head>
<body>
<div class="paper">
  <div class="band"><b>تنبيه</b><span>NOTICE</span></div>
  <div class="body">
    <div><h1>لا نبيع الأسلحة النارية ولا الذخيرة</h1><p>سترات خفيفة وأسلحة بيضاء فقط. سترة واحدة لكل شخص في اليوم.</p></div>
    <svg class="icon" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#b3261e" stroke-width="10"/>
      <path d="M28 52h48l6-6h10v12H80l-4 4H62l-6 26H42l5-24H28z" fill="#1d1d1b"/>
      <line x1="24" y1="96" x2="96" y2="24" stroke="#b3261e" stroke-width="10" stroke-linecap="round"/></svg>
  </div>
  <div class="foot"><span>بأمر من بلدية لوس سانتوس</span><span class="en">AMMU-NATION</span></div>
</div>
<div class="tape l"></div><div class="tape r"></div>
</body></html>
