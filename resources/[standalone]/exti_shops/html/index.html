<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>Shop</title>
    <link rel="stylesheet" href="kit.css">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="kit">
    <div id="app" class="hidden">
        <div class="shop kit-panel" id="shop">
            <header class="shop-top">
                <div class="kit-brand">
                    <div class="kit-brand-icon brand-icon" id="shopIcon"></div>
                    <div class="kit-brand-text">
                        <h1 id="shopName">بقالة 24/7</h1>
                        <p id="shopArea"></p>
                    </div>
                </div>
                <div class="top-end">
                    <div class="wallet">
                        <div class="purse" id="purseCash">
                            <span class="purse-label">نقدًا</span>
                            <b class="purse-value" id="cash">$0</b>
                        </div>
                        <div class="purse" id="purseBank">
                            <span class="purse-label">البنك</span>
                            <b class="purse-value" id="bank">$0</b>
                        </div>
                    </div>
                    <button class="kit-icon-btn" id="closeBtn" title="إغلاق (Esc)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                    </button>
                </div>
            </header>

            <div class="clerk-line">
                <span class="clerk-dot"></span>
                <span class="clerk-name">البائع:</span>
                <span id="greeting"></span>
            </div>

            <div class="notice" id="notice" hidden></div>

            <div class="shop-body">
                <section class="catalog">
                    <div class="kit-chips chips" id="chips"></div>
                    <div class="grid kit-scroll" id="grid"></div>
                </section>

                <aside class="cart">
                    <div class="cart-head">
                        <div class="cart-title">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
                            <h2>السلة</h2>
                            <span class="cart-count" id="cartCount">0</span>
                        </div>
                        <button class="link-btn" id="clearBtn">إفراغ</button>
                    </div>
                    <div class="cart-list kit-scroll" id="cartList"></div>
                    <div class="cart-foot">
                        <div class="total-row">
                            <span>المجموع</span>
                            <b id="total">$0</b>
                        </div>
                        <div class="pay">
                            <button class="kit-btn primary pay-btn" id="payCash">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg>
                                <span>ادفع نقدًا</span>
                            </button>
                            <button class="kit-btn pay-btn" id="payBank">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg>
                                <span>ادفع بالبطاقة</span>
                            </button>
                        </div>
                        <p class="pay-note" id="payNote"></p>
                    </div>
                </aside>
            </div>

            <div class="kit-toast" id="toast"></div>
            <div class="receipt" id="receipt">
                <div class="receipt-card">
                    <div class="receipt-check">
                        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>
                    </div>
                    <b>تم الشراء</b>
                    <span id="receiptText"></span>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js?v=4"></script>
</body>
</html>
