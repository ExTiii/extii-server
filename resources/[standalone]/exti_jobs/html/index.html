<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>مركز التوظيف</title>
    <link rel="stylesheet" href="kit.css?v=1" />
    <link rel="stylesheet" href="style.css?v=1" />
</head>
<body class="kit">
    <div id="root" class="root" aria-hidden="true">
        <section class="tablet" id="tablet" role="dialog" aria-label="مركز التوظيف">
            <div class="screen" id="screen"></div>

            <div class="kit-sheet-layer" id="sheet-layer">
                <div class="kit-sheet-backdrop" data-act="sheet-close"></div>
                <div class="kit-sheet" id="sheet"></div>
            </div>
            <div class="kit-toast" id="toast" role="status"></div>
        </section>
    </div>
    <script src="app.js?v=1"></script>
</body>
</html>
